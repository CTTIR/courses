name: Validate and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: courses-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.19"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      - name: Install native build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libfftw3-dev libcurl4-openssl-dev \
            libssl-dev libxml2-dev libfontconfig1-dev libfreetype6-dev \
            libharfbuzz-dev libfribidi-dev libpng-dev libtiff-dev libjpeg-dev \
            libwebp-dev libuv1-dev libglpk-dev zlib1g-dev
      - uses: r-lib/actions/setup-renv@v2
      - run: npm ci
      - name: Check prerequisites and regression tests
        run: |
          Rscript setup_check.R
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py'
          Rscript -e 'testthat::test_dir("tests", stop_on_failure = TRUE, stop_on_warning = TRUE)'
      - name: Exercise standalone lab scripts
        run: python3 scripts/check_labs.py --log-dir "$RUNNER_TEMP/lab-checks"
      - name: Recompute and render every article and slide
        run: quarto render --profile verify
      - name: Verify deliverables
        run: |
          python3 scripts/check_site.py
          bash scripts/check-legal-placeholders.sh
      - name: Verify browser journeys
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-validation
          path: ${{ runner.temp }}/lab-checks
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
